    <script id="cv-visibility-script">(function(){function applyCvVisibility(cfg){if(!cfg)return;if(typeof cfg!=='object')return;var cvConfig=cfg.cv;if(!cvConfig)return;var hiddenSections=cvConfig.hidden_sections;if(hiddenSections){hiddenSections.forEach(function(sec){var slug=sec.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');var anchor=document.getElementById(slug);if(anchor){anchor.style.setProperty('display','none','important');var card=anchor.nextElementSibling;if(card){if(card.classList.contains('card')){card.style.setProperty('display','none','important');}}}var cards=document.querySelectorAll('.cv .card, .card');cards.forEach(function(c){var titleEl=c.querySelector('h3.card-title');if(titleEl){if(titleEl.textContent.trim().toLowerCase()===sec.toLowerCase()){c.style.setProperty('display','none','important');var prev=c.previousElementSibling;if(prev){if(prev.classList.contains('anchor')){prev.style.setProperty('display','none','important');}}}}});var tocLinks=document.querySelectorAll('#toc-sidebar a[href=\"#'+slug+'\"]');tocLinks.forEach(function(link){var li=link.closest('li');if(!li)li=link;li.style.setProperty('display','none','important');});});}var hiddenExp=cvConfig.hidden_experience;if(hiddenExp){if(hiddenExp.length!==0){var expAnchor=document.getElementById('experience');var expCard=null;if(expAnchor)expCard=expAnchor.nextElementSibling;if(expCard){var expItems=expCard.querySelectorAll('.list-group-item');expItems.forEach(function(item){var text=item.textContent;if(!text)text='';hiddenExp.forEach(function(expKey){if(text.indexOf(expKey)!==-1){item.style.setProperty('display','none','important');}});});}}}var hiddenProj=cvConfig.hidden_projects;if(hiddenProj){if(hiddenProj.length!==0){var projAnchor=document.getElementById('projects');var projCard=null;if(projAnchor)projCard=projAnchor.nextElementSibling;if(projCard){var projItems=projCard.querySelectorAll('.list-group-item');projItems.forEach(function(item){var titleEl=item.querySelector('h6.title');var titleText='';if(titleEl)titleText=titleEl.textContent.trim();hiddenProj.forEach(function(projKey){if(titleText.toLowerCase().indexOf(projKey.toLowerCase())!==-1){item.style.setProperty('display','none','important');}});});}}}var hiddenRef=cvConfig.hidden_references;if(hiddenRef){if(hiddenRef.length!==0){var refAnchor=document.getElementById('references');var refCard=null;if(refAnchor)refCard=refAnchor.nextElementSibling;if(refCard){var refItems=refCard.querySelectorAll('.list-group-item');refItems.forEach(function(item){var nameEl=item.querySelector('strong');var nameText='';if(nameEl)nameText=nameEl.textContent.trim();hiddenRef.forEach(function(refKey){if(nameText.toLowerCase().indexOf(refKey.toLowerCase())!==-1){item.style.setProperty('display','none','important');}});});}}}}function initCvVisibility(){var applied=false;try{var localStr=localStorage.getItem('nathy_visibility_config');if(localStr){var localCfg=JSON.parse(localStr);if(localCfg){if(localCfg.cv){applyCvVisibility(localCfg);applied=true;}}}}catch(e){}fetch('/al-folio/assets/json/visibility.json').then(function(res){if(res.ok)return res.json();return null;}).then(function(data){if(!applied){if(data){applyCvVisibility(data);}}}).catch(function(err){});}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initCvVisibility);}else{initCvVisibility();}window.addEventListener('load',initCvVisibility);})();</script>

