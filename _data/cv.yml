    Projects:
      - name: The Geometry of Dormant Defection (Latent Sleeper Agent Linear Probes)
        url: https://github.com/nathyBekele/geometry-of-dormant-defection
        summary: >
          Mechanistic interpretability research and 28-layer probing replication suite investigating layer-wise linear probe dynamics for detecting latent sleeper agents and dormant backdoors in large language models.
          <span class="cv-project-links">
            <a href="https://github.com/nathyBekele/geometry-of-dormant-defection" target="_blank" class="cv-action-btn"><i class="fa-brands fa-github"></i> GitHub Code</a>
            <a href="https://medium.com/@natnaelbekele142/your-open-source-ai-model-might-be-a-sleeper-agent-9ca693663091" target="_blank" class="cv-action-btn"><i class="fa-brands fa-medium"></i> Research Article</a>
            <a href="https://zenodo.org/records/23089057" target="_blank" class="cv-action-btn"><i class="fa-solid fa-graduation-cap"></i> Zenodo Preprint</a>
          </span>
        highlights:
          - "**Layer-Wise Activation Probing**: Designed and evaluated linear probes across all 28 transformer layers of Qwen2.5-Coder-1.5B-Instruct to trace where deceptive policies linearly separate from aligned representations."
          - "**Mid-Layer Concentration Discovery**: Discovered that peak linear separability concentrates in mid-layer representations, formulating trigger-agnostic defensive monitors that catch backdoors without inspecting outputs."
          - "**Tech Stack**: Python, PyTorch, Hugging Face Transformers, Linear Probes, Mechanistic Interpretability, Qwen2.5-Coder."

      - name: Amharic Hate Speech Detection
        url: https://huggingface.co/NathyB/Hate-Speech-Detection-in-Amharic-Language-mBERT
        summary: >
          Deep learning NLP research developed as B.Sc. Capstone at Addis Ababa University, utilizing fine-tuned multilingual BERT (mBERT) to detect online hate speech and abusive language in low-resource Ethiopic NLP.
          <span class="cv-project-links">
            <a href="https://huggingface.co/NathyB/Hate-Speech-Detection-in-Amharic-Language-mBERT" target="_blank" class="cv-action-btn"><i class="fa-solid fa-cube"></i> Hugging Face Model</a>
            <a href="https://github.com/nathyBekele/hate-speech-detection-in-amharic-language" target="_blank" class="cv-action-btn"><i class="fa-brands fa-github"></i> GitHub Code</a>
            <a href="https://github.com/nathyBekele/hate-speech-detection-in-amharic-language/blob/main/mBERT/Hate_Speech_Detection_in_Amharic_Language%5BmBERT%5D.ipynb" target="_blank" class="cv-action-btn"><i class="fa-solid fa-book-open"></i> Jupyter Notebook</a>
          </span>
        highlights:
          - "**Research & Model Weights**: Fine-tuned multilingual BERT (mBERT) representations capturing Amharic morphology; published trained weights and tokenizers on Hugging Face Model Hub."
          - "**Evaluation Pipeline**: Established robust evaluation benchmarks for classifying hate, offensive, and neutral content on low-resource social discourse datasets."
          - "**Tech Stack**: Python, PyTorch, Hugging Face Transformers, Datasets, mBERT, Jupyter/Colab."

      - name: AfroChat
        url: https://afrochat.app/
        summary: >
          AI-powered multi-model enterprise chat platform bringing cutting-edge LLMs together with custom workspace solutions, streaming architectures, and multi-tenant security.
          <span class="cv-project-links">
            <a href="https://afrochat.app/" target="_blank" class="cv-action-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> Live App</a>
          </span>
        highlights:
          - "**Distributed Backend**: Engineered real-time streaming chat completions and workspace orchestration using WebSockets, Redis pub/sub, and RabbitMQ message queues."
          - "**Production Cloud Infra**: Containerized services with Docker and Kubernetes, backed by MongoDB clusters and AWS S3/SES for assets and automated transactional mail."
          - "**Tech Stack**: Express, Node.js, MongoDB, OpenAI API, AWS S3/SES, Redis, WebSockets, Docker, Kubernetes, RabbitMQ."

      - name: Adot
        url: https://adot.life/
        summary: >
          Comprehensive maternal healthcare platform supporting pregnant women through personalized tracking, expert doctor consultations, and predictive AI health monitoring (consulted by MIT alumnus Adis Ojeda).
          <span class="cv-project-links">
            <a href="https://adot.life/" target="_blank" class="cv-action-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> Live Platform</a>
          </span>
        highlights:
          - "**Fullstack & Mobile Ecosystem**: Architected web client and companion mobile interface delivering clinical appointment booking and personalized trimester milestone tracking."
          - "**Predictive Health Modeling**: Implemented predictive analytics for prenatal risk factors with secure cloud storage, HIPAA-conscious design, and real-time alerts."
          - "**Tech Stack**: Next.js, Node.js, MongoDB, Flutter, Django, TypeScript, Tailwind CSS, GCP, Firebase, Docker."

      - name: Cursor Spend Tracker
