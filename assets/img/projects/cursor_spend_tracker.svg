<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cst-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#141E34"/>
    </linearGradient>
    <radialGradient id="cst-glow" cx="400" cy="220" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cst-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.04"/>
      <circle cx="0" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#cst-bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#cst-grid)"/>
  <rect width="800" height="500" rx="16" fill="url(#cst-glow)"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" stroke="#3B82F6" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <g transform="translate(400, 75)">
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.35"/>
    <circle cx="-88" cy="0" r="4" fill="#38BDF8"/>
    <text text-anchor="middle" x="8" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#93C5FD" letter-spacing="1.5">CURSOR &#8226; BYOK ANALYTICS</text>
  </g>

  <!-- Center Graphic & Typography -->
  <g transform="translate(400, 225)">
    <!-- 3D Isometric Spend / Analytics Cube & Cursor Icon -->
    <g transform="translate(-165, -50)">
      <rect x="0" y="0" width="88" height="88" rx="20" fill="#131C31" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2"/>
      
      <!-- Mini Chart Bars -->
      <rect x="22" y="52" width="8" height="18" rx="2" fill="#38BDF8" fill-opacity="0.5"/>
      <rect x="34" y="40" width="8" height="30" rx="2" fill="#38BDF8" fill-opacity="0.75"/>
      <rect x="46" y="32" width="8" height="38" rx="2" fill="#60A5FA"/>
      <rect x="58" y="24" width="8" height="46" rx="2" fill="#38BDF8"/>
      
      <!-- Trend Line & Arrow -->
      <path d="M 24 48 Q 42 34 62 20" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="62" cy="20" r="3.5" fill="#A78BFA"/>
    </g>

    <!-- Typography -->
    <g transform="translate(-55, -8)">
      <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">
        Cursor <tspan fill="#38BDF8">Spend Tracker</tspan>
      </text>
      <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
        Claude BYOK Cost Breakdown &amp; Usage Telemetry
      </text>
    </g>
  </g>

  <!-- Bottom Tag Pill -->
  <g transform="translate(400, 400)">
    <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#0C1424" stroke="#3B82F6" stroke-opacity="0.32" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#BFDBFE" letter-spacing="1.2">NEXT.JS &#8226; PRISMA &#8226; RECHARTS &#8226; VERCEL</text>
  </g>
</svg>
