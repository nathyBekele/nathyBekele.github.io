<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nlp-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18060A"/>
      <stop offset="50%" stop-color="#2B0C14"/>
      <stop offset="100%" stop-color="#3E121E"/>
    </linearGradient>
    <radialGradient id="nlp-glow" cx="400" cy="210" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#FB7185" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="nlp-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 40 20 M 20 0 L 20 40" fill="none" stroke="#F43F5E" stroke-width="1" stroke-opacity="0.04"/>
      <circle cx="20" cy="20" r="1.5" fill="#F43F5E" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#nlp-bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#nlp-pattern)"/>
  <rect width="800" height="500" rx="16" fill="url(#nlp-glow)"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" stroke="#F43F5E" stroke-opacity="0.22"/>

  <!-- Top Pill -->
  <g transform="translate(400, 75)">
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#F43F5E" fill-opacity="0.12" stroke="#F43F5E" stroke-opacity="0.3"/>
    <circle cx="-90" cy="0" r="4" fill="#F43F5E"/>
    <text text-anchor="middle" x="10" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#FECDD3" letter-spacing="1.5">ETHIOPIC NLP &amp; SAFETY</text>
  </g>

  <!-- Center Artwork: Shield with Ge'ez glyph & BERT nodes -->
  <g transform="translate(400, 205)">
    <!-- Outer Shield Halo -->
    <circle cx="0" cy="-15" r="82" fill="#F43F5E" fill-opacity="0.08" stroke="#F43F5E" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Shield Shape -->
    <path d="M 0 -75 L 50 -55 C 50 0 25 35 0 55 C -25 35 -50 0 -50 -55 Z" fill="#260810" stroke="#F43F5E" stroke-width="2.5"/>
    
    <!-- Shield Accent Line -->
    <path d="M 0 -62 L 38 -46 C 38 -2 18 26 0 42 C -18 26 -38 -2 -38 -46 Z" fill="none" stroke="#FB7185" stroke-opacity="0.35" stroke-width="1.5"/>
    
    <!-- Amharic Ge'ez Character: ቃል (Word/Speech) or ሰ (Peace) -->
    <text text-anchor="middle" y="6" font-family="'Noto Sans Ethiopic', 'Abyssinica SIL', Nyala, system-ui, sans-serif" font-size="42" font-weight="700" fill="#FFE4E6">ቃል</text>

    <!-- Subtitle text -->
    <text text-anchor="middle" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Amharic Hate Speech Detection</text>
    <text text-anchor="middle" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FDA4AF" letter-spacing="1">Fine-tuned mBERT &amp; Transformers Pipeline</text>
  </g>

  <!-- Bottom Tag Badge -->
  <g transform="translate(400, 395)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#24090F" stroke="#F43F5E" stroke-opacity="0.32" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFE4E6" letter-spacing="1.2">MULTILINGUAL BERT • HUGGINGFACE</text>
  </g>
</svg>