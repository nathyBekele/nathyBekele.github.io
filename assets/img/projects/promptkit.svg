<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="prompt-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080E24"/>
      <stop offset="50%" stop-color="#111638"/>
      <stop offset="100%" stop-color="#1B1E4D"/>
    </linearGradient>
    <radialGradient id="prompt-glow" cx="400" cy="210" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="prompt-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 40 40 M 40 0 L 0 40" fill="none" stroke="#818CF8" stroke-width="1" stroke-opacity="0.04"/>
      <circle cx="20" cy="20" r="1.2" fill="#818CF8" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#prompt-bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#prompt-pattern)"/>
  <rect width="800" height="500" rx="16" fill="url(#prompt-glow)"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" stroke="#818CF8" stroke-opacity="0.22"/>

  <g transform="translate(400, 75)">
    <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#818CF8" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.28"/>
    <circle cx="-85" cy="0" r="4" fill="#818CF8"/>
    <text text-anchor="middle" x="8" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#C7D2FE" letter-spacing="1.5">LLM PROMPT OPTIMIZER</text>
  </g>

  <!-- Center Artwork: Prompt Terminal / Prompt Engineering Icon -->
  <g transform="translate(400, 205)">
    <!-- Glow behind icon -->
    <rect x="-65" y="-65" width="130" height="130" rx="28" fill="#4F46E5" fill-opacity="0.18" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1.5"/>
    
    <!-- Terminal Prompt Prompt symbol: >_ with sparkles -->
    <path d="M -32 -25 L -10 0 L -32 25" fill="none" stroke="#A5B4FC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-2" y1="25" x2="28" y2="25" stroke="#818CF8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Sparkle / Star on top right of terminal -->
    <path d="M 28 -32 Q 28 -20 40 -20 Q 28 -20 28 -8 Q 28 -20 16 -20 Q 28 -20 28 -32 Z" fill="#38BDF8"/>

    <text text-anchor="middle" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">promptKit</text>
    <text text-anchor="middle" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#A5B4FC" letter-spacing="1">Automated Prompt Synthesis &amp; Evaluation</text>
  </g>

  <g transform="translate(400, 395)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#12163A" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#E0E7FF" letter-spacing="1.2">TEST SYNTHESIS • BENCHMARKING</text>
  </g>
</svg>