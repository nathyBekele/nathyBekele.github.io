<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rateeat-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#180A04"/>
      <stop offset="50%" stop-color="#281107"/>
      <stop offset="100%" stop-color="#3D180A"/>
    </linearGradient>
    <radialGradient id="rateeat-glow" cx="400" cy="230" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#FF7A00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rateeat-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 Q 10 10 20 20 T 40 20" fill="none" stroke="#FF5722" stroke-width="1" stroke-opacity="0.05"/>
      <circle cx="20" cy="20" r="1.5" fill="#FF5722" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#rateeat-bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#rateeat-grid)"/>
  <rect width="800" height="500" rx="16" fill="url(#rateeat-glow)"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" stroke="#FF5722" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <g transform="translate(400, 75)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#FF5722" fill-opacity="0.12" stroke="#FF5722" stroke-opacity="0.32"/>
    <circle cx="-62" cy="0" r="4" fill="#FF5722"/>
    <text text-anchor="middle" x="8" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#FFAB91" letter-spacing="1.5">FOOD DISCOVERY</text>
  </g>

  <!-- Central Logo & Icon Composition -->
  <g transform="translate(400, 225)">
    <!-- Foodie / Dining Icon -->
    <g transform="translate(-160, -45)">
      <circle cx="45" cy="45" r="42" fill="#FF5722" fill-opacity="0.15" stroke="#FF5722" stroke-opacity="0.4" stroke-width="2"/>
      <!-- Fork & Spoon/Knife motif -->
      <path d="M34 25 V45 C34 49 38 52 42 52 V65" stroke="#FF7A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30 25 V37 M38 25 V37" stroke="#FF7A00" stroke-width="2" stroke-linecap="round"/>
      <path d="M54 25 C50 25 48 30 48 38 C48 47 51 52 54 52 V65" stroke="#FFAB91" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Small Sparkle / Star -->
      <path d="M62 20 L63.5 25 L68.5 26.5 L63.5 28 L62 33 L60.5 28 L55.5 26.5 L60.5 25 Z" fill="#FFA726"/>
    </g>

    <!-- RateEat Title -->
    <g transform="translate(-50, 0)">
      <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Rate<tspan fill="#FF5722">Eat</tspan></text>
      <!-- Star ratings row -->
      <g transform="translate(2, 28)">
        <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#FFA726" transform="translate(6, 0) scale(1.1)"/>
        <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#FFA726" transform="translate(24, 0) scale(1.1)"/>
        <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#FFA726" transform="translate(42, 0) scale(1.1)"/>
        <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#FFA726" transform="translate(60, 0) scale(1.1)"/>
        <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#FFA726" transform="translate(78, 0) scale(1.1)"/>
        <text x="96" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFAB91">COMMUNITY REVIEWS</text>
      </g>
    </g>
  </g>

  <!-- Bottom Tag Pill -->
  <g transform="translate(400, 400)">
    <rect x="-175" y="-18" width="350" height="36" rx="18" fill="#220D05" stroke="#FF5722" stroke-opacity="0.32" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFCCBC" letter-spacing="1.2">COMMUNITY DINING &amp; REVIEWS</text>
  </g>
</svg>
